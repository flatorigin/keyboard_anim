<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>21. Hand gestures — Typing Lesson</title>

<style>
  :root{
    --bg:#f6f7fb;
    --ink:#1f2a44;
    --muted:#8a93a4;
    --accent:#2f6bdc;

    --card:#ffffff;
    --kbdBorder:#d9dee8;
    --keyBorder:#dfe3ea;
    --keyBg:#ffffff;
    --keyInk:#2d3d63;

    --shadow:0 10px 24px rgba(16,24,40,.08);
    --shadow2:0 6px 16px rgba(16,24,40,.10);

    --radius:18px;
    --keyRadius:8px;

    --pressBg:#e6efff;
    --pressBorder:#9bb7ff;
    --pressInk:#1f4fc7;
  }

  *{box-sizing:border-box}
  body{
    margin:0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background:var(--bg);
    color:var(--ink);
  }

  /* Top bar */
  .topbar{
    height:64px;
    background:#fff;
    border-bottom:1px solid #eef1f6;
    display:flex;
    align-items:center;
    padding:0 18px;
    gap:14px;
  }
  .burger{
    width:34px;height:34px;border-radius:10px;
    display:grid;place-items:center;
    color:#6b7280;
  }
  .burger svg{width:20px;height:20px}
  .title{
    font-weight:600;
    color:#2a3857;
    letter-spacing:.2px;
  }
  .spacer{flex:1}
  .user{
    display:flex;align-items:center;gap:10px;color:#475569;font-weight:600;
  }
  .avatar{
    width:34px;height:34px;border-radius:999px;
    background:linear-gradient(135deg,#d7e3ff,#f3f7ff);
    border:1px solid #e6edf7;
  }
  .caret{opacity:.7}

  /* Right floating buttons (like screenshot) */
  .floating{
    position:fixed;
    right:18px;
    top:108px;
    display:flex;
    flex-direction:column;
    gap:10px;
    background:#fff;
    border:1px solid #eef1f6;
    border-radius:999px;
    padding:10px;
    box-shadow: var(--shadow2);
  }
  .fab{
    width:40px;height:40px;border-radius:999px;
    display:grid;place-items:center;
    color:#64748b;
    background:#fff;
    border:1px solid #eef1f6;
  }
  .fab svg{width:18px;height:18px}

  /* Main layout */
  .wrap{
    max-width:900px;
    margin:50px auto 40px;
    padding:0 18px;
    display:flex;
    flex-direction: column;
    align-items:center;
  }

  .start{
    margin-top:10px;
    position:relative;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:10px 18px;
    border-radius:12px;
    background:var(--accent);
    color:#fff;
    font-weight:700;
    font-size:12px;
    letter-spacing:.8px;
    text-transform:uppercase;
    border:none;
    cursor:pointer;
    box-shadow:0 10px 22px rgba(47,107,220,.24);
  }
  .start:after{
    content:"";
    position:absolute;
    align-items:center;
    left:18px;
    bottom:-7px;
    width:0;height:0;
    border-left:8px solid transparent;
    border-right:8px solid transparent;
    border-top:8px solid var(--accent);
    filter: drop-shadow(0 3px 2px rgba(16,24,40,.08));
  }
  .hint{
    margin-top:10px;
    color:var(--muted);
    font-size:13px;
  }

  /* Exercise text */
  .exercise{
    width:min(820px, 100%);
    margin-top:18px;
    text-align:left;
    color:#2a3a5f;
  }

  .line{
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    font-size:44px;
    line-height:1.4;
    letter-spacing:.8px;
    margin:18px 0;
    position:relative;
  }
  .divider{
    width:100%;
    border-bottom:2px dotted #cfd6e1;
    opacity:.55;
    margin:14px auto 8px;
  }

  /* Cursor underline: applied to .ch.active */
  .ch{
    position:relative;
    display:inline-block;
    padding:0 1px;
    transition: transform 200ms ease, color 180ms ease,background-color 180ms ease;
  }
  .ch.active::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    height:4px;
    background:var(--accent);
    border-radius:999px;
    bottom:-10px;
  }
  .ch.active{
    background:#eaf3ff;
    border-radius:6px;
  }
  .ch.correct{
    color:#0f9153;
  }
  .ch.wrong{
    color:#d62839;
  }
  .ch.bump{
    animation:typedPop 200ms ease;
  }
  .ch.shake{
    animation:typedShake 240ms ease;
  }
  @keyframes typedPop{
    0%{transform:translateY(0) scale(1)}
    35%{transform:translateY(-6px) scale(1.06)}
    100%{transform:translateY(0) scale(1)}
  }
  @keyframes typedShake{
    0%{transform:translateX(0)}
    25%{transform:translateX(-2px)}
    50%{transform:translateX(2px)}
    75%{transform:translateX(-2px)}
    100%{transform:translateX(0)}
  }

  /* Keyboard */
  .kbdWrap{
    margin-top:24px;
    width:min(1000px, 100%);
    background:#f2f4f8;
    border:1px solid #eceff6;
    border-radius:18px;
    padding:14px 14px 16px;
  }

  .kbd{
    background:#f3f5f9;
    border:2px solid #d7dbe6;
    border-radius:16px;
    padding:10px;
  }
  .row{
    display:flex;
    gap:8px;
    margin-bottom:8px;
  }

  .key{
    position:relative;
    flex:1;
    height:48px;
    background:var(--keyBg);
    border:2px solid var(--keyBorder);
    border-radius:var(--keyRadius);
    box-shadow:0 2px 0 rgba(16,24,40,.04);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--keyInk);
    font-weight:600;
    user-select:none;
    overflow:visible;
  }
  .key.small{height:42px}
  .key.w1_5{flex:1.5}
  .key.w2{flex:2}
  .key.w2_5{flex:2.5}
  .key.w3{flex:3}
  .key.w5{flex:5}

  .key .sub{
    position:absolute;
    top:6px;
    left:8px;
    font-size:12px;
    opacity:.85;
    font-weight:700;
    color:#42557e;
  }
  .key .main{
    font-size:18px;
    letter-spacing:.4px;
  }

  /* “Press” animation + darker tint */
  .key.press{
    background:var(--pressBg);
    border-color:var(--pressBorder);
    color:var(--pressInk);
    box-shadow:0 10px 18px rgba(47,107,220,.12);
    animation: keyPress 360ms ease-in-out;
    transform-origin:center;
  }
  @keyframes keyPress{
    0%{transform:scale(1)}
    35%{transform:scale(1.1)}
    70%{transform:scale(.9)}
    100%{transform:scale(1)}
  }

  /* Stars above the pressed key */
  .stars{
    position:absolute;
    left:50%;
    top:-18px;
    transform:translateX(-50%);
    display:flex;
    gap:6px;
    pointer-events:none;
    opacity:0;
  }
  .key.press .stars{
    opacity:1;
    animation: starsIn 360ms ease-in-out;
  }
  @keyframes starsIn{
    0%{transform:translateX(-50%) translateY(6px); opacity:0}
    45%{transform:translateX(-50%) translateY(-2px); opacity:1}
    100%{transform:translateX(-50%) translateY(0); opacity:0}
  }
  .star{
    width:12px;height:12px;
    background: radial-gradient(circle at 30% 30%, #ffffff, #ffd56a 45%, #ffb11a 70%, #ff9a00);
    clip-path: polygon(50% 0%, 62% 36%, 100% 38%, 70% 60%, 80% 100%, 50% 78%, 20% 100%, 30% 60%, 0% 38%, 38% 36%);
    filter: drop-shadow(0 2px 2px rgba(16,24,40,.12));
  }
  .star.s2{transform:translateY(2px) scale(.9)}
  .star.s3{transform:translateY(1px) scale(.8)}

  /* Subtle “home keys” styling (optional) */
  .home{
    border-color:#cfe0ff;
  }

  /* Responsive tweaks */
  @media (max-width: 880px){
    .line{font-size:34px}
    .kbdWrap{transform:scale(.98); transform-origin:top center}
  }
  @media (max-width: 560px){
    .line{font-size:26px}
    .row{gap:6px;margin-bottom:6px}
    .key{height:44px}
  }
</style>
</head>

<script>
  // ===== Exercise content (you can swap these strings anytime) =====
  const lines = [
    "ffff jj fjfj ffjj jjff fj f",
    "ffff jfjf jj ff jj jf fj jj",
    "fjff jfjj jjjf fjjj fj fj",
    "fjfj jfjf jf jf jf fj fj jf"
  ];

  // Render exercise with per-character spans so we can underline the active char.
  const lineEls = [line1, line2, line3, line4];
  const charSpans = []; // flat list: {span, ch}
  function renderExercise(){
    charSpans.length = 0;
    lineEls.forEach((el, i) => {
      el.innerHTML = "";
      const text = lines[i];
      [...text].forEach(ch => {
        const s = document.createElement("span");
        s.className = "ch";
        s.textContent = ch === " " ? "\u00A0" : ch;
        el.appendChild(s);
        charSpans.push({ span: s, ch });
      });
    });
  }
  renderExercise();

  // Keyboard map
  const keyEls = new Map();
  document.querySelectorAll(".key").forEach(k => {
    const dk = k.getAttribute("data-key");
    if (!dk) return;
    // normalize to lower for letters
    keyEls.set(dk, k);
    if (dk.length === 1 && /[A-Z]/.test(dk)) keyEls.set(dk.toLowerCase(), k);
  });

  // Find next "typeable" index (skip spaces)
  let idx = 0;
  function moveCursorTo(i){
    charSpans.forEach(o => o.span.classList.remove("active"));
    if (!charSpans[i]) return;
    charSpans[i].span.classList.add("active");
  }
  function animateSpan(span, cls){
    span.classList.remove("bump", "shake");
    span.classList.remove(cls);
    void span.offsetWidth;
    span.classList.add(cls);
  }
  function nextTypeable(from){
    let i = from;
    while (i < charSpans.length && charSpans[i].ch === " ") i++;
    return i;
  }
  idx = nextTypeable(0);
  moveCursorTo(idx);

  function pressKey(key){
    // Prefer letters + space. Normalize.
    let k = key;
    if (k === " ") k = "Space";
    if (typeof k === "string" && k.length === 1) k = k.toLowerCase();

    const el = keyEls.get(k) || keyEls.get(key);
    if (!el) return;

    el.classList.remove("press"); // restart animation
    // Force reflow to restart animation reliably
    void el.offsetWidth;
    el.classList.add("press");

    // Clean up class after animation ends
    window.setTimeout(() => el.classList.remove("press"), 420);
  }

  // ===== Demo typing (autoplay) =====
  let demoTimer = null;
  let started = false;
  function demoStep(){
    if (started) return;
    const i = nextTypeable(idx);
    if (i >= charSpans.length) {
      idx = nextTypeable(0);
      moveCursorTo(idx);
      return;
    }
    const ch = charSpans[i].ch;
    pressKey(ch === " " ? "Space" : ch);
    moveCursorTo(i);
    idx = i + 1;
  }
  demoTimer = setInterval(demoStep, 520);

  // ===== Start typing (real input) =====
  const startBtn = document.getElementById("startBtn");
  const hint = document.getElementById("hint");

  function startTyping(){
    started = true;
    hint.textContent = "Typing enabled. Your keystrokes will animate the on-screen key.";
    clearInterval(demoTimer);
    startBtn.textContent = "TYPING…";
    startBtn.style.opacity = ".9";
  }

  startBtn.addEventListener("click", () => {
    if (!started) startTyping();
  });

  // Real typing handler
  window.addEventListener("keydown", (e) => {
    if (!started) return;

    // show press animation
    if (e.key === "Backspace") pressKey("Backspace");
    else if (e.key === "Enter") pressKey("Enter");
    else if (e.key === "Tab") { e.preventDefault(); pressKey("Tab"); }
    else if (e.key === " ") { e.preventDefault(); pressKey("Space"); }
    else if (e.key.length === 1) pressKey(e.key);

    // advance cursor only if correct key matches current exercise character (ignoring spaces)
    const i = nextTypeable(idx);
    if (i >= charSpans.length) return;

    const expected = charSpans[i].ch;
    const got = e.key === " " ? " " : e.key.toLowerCase();

    const span = charSpans[i].span;

    if (expected !== " " && expected.toLowerCase() === got){
      span.classList.remove("wrong");
      span.classList.add("correct");
      animateSpan(span, "bump");
      idx = i + 1;
      idx = nextTypeable(idx);
      moveCursorTo(idx);
    } else if (expected !== " ") {
      span.classList.remove("correct");
      span.classList.add("wrong");
      animateSpan(span, "shake");
    }
  });

</script>
</body>
