<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>21. Hand gestures — Typing Lesson</title>

<style>
  :root{
    --bg:#f6f7fb;
    --ink:#1f2a44;
    --muted:#8a93a4;
    --accent:#2f6bdc;

    --card:#ffffff;
    --kbdBorder:#d9dee8;
    --keyBorder:#dfe3ea;
    --keyBg:#ffffff;
    --keyInk:#2d3d63;

    --shadow:0 10px 24px rgba(16,24,40,.08);
    --shadow2:0 6px 16px rgba(16,24,40,.10);

    --radius:18px;
    --keyRadius:8px;

    --pressBg:#e6efff;
    --pressBorder:#9bb7ff;
    --pressInk:#1f4fc7;
  }

  *{box-sizing:border-box}
  body{
    margin:0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background:var(--bg);
    color:var(--ink);
  }

  .topbar{
    height:64px;
    background:#fff;
    border-bottom:1px solid #eef1f6;
    display:flex;
    align-items:center;
    padding:0 18px;
    gap:14px;
  }
  .burger{
    width:34px;height:34px;border-radius:10px;
    display:grid;place-items:center;
    color:#6b7280;
  }
  .burger svg{width:20px;height:20px}
  .title{
    font-weight:600;
    color:#2a3857;
    letter-spacing:.2px;
  }
  .spacer{flex:1}
  .user{
    display:flex;align-items:center;gap:10px;color:#475569;font-weight:600;
  }
  .avatar{
    width:34px;height:34px;border-radius:999px;
    background:linear-gradient(135deg,#d7e3ff,#f3f7ff);
    border:1px solid #e6edf7;
  }
  .caret{opacity:.7}

  .floating{
    position:fixed;
    right:18px;
    top:108px;
    display:flex;
    flex-direction:column;
    gap:10px;
    background:#fff;
    border:1px solid #eef1f6;
    border-radius:999px;
    padding:10px;
    box-shadow: var(--shadow2);
  }
  .fab{
    width:40px;height:40px;border-radius:999px;
    display:grid;place-items:center;
    color:#64748b;
    background:#fff;
    border:1px solid #eef1f6;
  }
  .fab svg{width:18px;height:18px}

  .wrap{
    max-width:900px;
    margin:50px auto 40px;
    padding:0 18px;
    display:flex;
    flex-direction: column;
    align-items:center;
  }

  .start{
    margin-top:10px;
    position:absolute;
    z-index:5;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:10px 18px;
    border-radius:12px;
    background:var(--accent);
    color:#fff;
    font-weight:700;
    font-size:12px;
    letter-spacing:.8px;
    text-transform:uppercase;
    border:none;
    cursor:pointer;
    box-shadow:0 10px 22px rgba(47,107,220,.24);
    transform:translate(-50%, -50%);
  }
  .start.hidden{display:none;}
  .start:after{
    content:"";
    position:absolute;
    align-items:center;
    left:18px;
    bottom:-7px;
    width:0;height:0;
    border-left:8px solid transparent;
    border-right:8px solid transparent;
    border-top:8px solid var(--accent);
    filter: drop-shadow(0 3px 2px rgba(16,24,40,.08));
  }
  .hint{
    margin-top:10px;
    color:var(--muted);
    font-size:13px;
  }

  .exercise{
    width:min(820px, 100%);
    margin-top:18px;
    text-align:left;
    color:#2a3a5f;
    position:relative;
  }

  .line{
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    font-size:44px;
    line-height:1.4;
    letter-spacing:.8px;
    margin:18px 0;
    position:relative;
  }
  .divider{
    width:100%;
    border-bottom:2px dotted #cfd6e1;
    opacity:.55;
    margin:14px auto 8px;
  }

  .ch{
    position:relative;
    display:inline-block;
    padding:0 1px;
    transition: transform 200ms ease, color 180ms ease,background-color 180ms ease;
  }
  .ch.active::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    height:4px;
    background:var(--accent);
    border-radius:999px;
    bottom:-10px;
  }
  .ch.active{
    background:#eaf3ff;
    border-radius:6px;
  }
  .ch.correct{ color:#3CA947; }
  .ch.wrong{ color:#E86969; }
  .ch.fixed{ color:#d6a000; }

  .ch.bump{ animation:typedPop 200ms ease; }
  .ch.shake{ animation:typedShake 240ms ease; }

  @keyframes typedPop{
    0%{transform:translateY(0) scale(1)}
    35%{transform:translateY(1px) scale(0.95)}
    100%{transform:translateY(0px) scale(1)}
  }
  @keyframes typedShake{
    0%{transform:translateX(0)}
    25%{transform:translateX(-5px)}
    50%{transform:translateX(3px)}
    75%{transform:translateX(-2px)}
    100%{transform:translateX(0)}
  }

  .kbdWrap{
    margin-top:24px;
    width:min(1000px, 100%);
    border-radius:18px;
    padding:14px 14px 16px;
  }

  .kbd{
    background:#f3f5f9;
    border:2px solid #d7dbe6;
    border-radius:16px;
    padding:10px;
  }
  .row{
    display:flex;
    gap:8px;
    margin-bottom:8px;
  }

  .key{
    position:relative;
    flex:1;
    height:48px;
    background:var(--keyBg);
    border:2px solid var(--keyBorder);
    border-radius:var(--keyRadius);
    box-shadow:0 2px 0 rgba(16,24,40,.04);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--keyInk);
    font-weight:600;
    user-select:none;
    overflow:visible;
  }
  .key.small{height:42px}
  .key.w1_5{flex:1.5}
  .key.w2{flex:2}
  .key.w2_5{flex:2.5}
  .key.w3{flex:3}
  .key.w5{flex:5}

  .key .sub{
    position:absolute;
    top:6px;
    left:8px;
    font-size:12px;
    opacity:.85;
    font-weight:700;
    color:#42557e;
  }
  .key .main{
    font-size:18px;
    letter-spacing:.4px;
  }

  .key.press{
    background:var(--pressBg);
    border-color:var(--pressBorder);
    color:var(--pressInk);
    box-shadow:0 10px 18px rgba(47,107,220,.12);
    animation: keyPress 360ms ease-in-out;
    transform-origin:center;
  }
  @keyframes keyPress{
    0%{transform:scale(1)}
    35%{transform:scale(1.1)}
    70%{transform:scale(.9)}
    100%{transform:scale(1)}
  }

  .stars{
    position:absolute;
    left:50%;
    top:-18px;
    transform:translateX(-50%);
    display:flex;
    gap:6px;
    pointer-events:none;
    opacity:0;
  }
  .key.press .stars{
    opacity:1;
    animation: starsIn 360ms ease-in-out;
  }
  @keyframes starsIn{
    0%{transform:translateX(-50%) translateY(6px); opacity:0}
    45%{transform:translateX(-50%) translateY(-2px); opacity:1}
    100%{transform:translateX(-50%) translateY(0); opacity:0}
  }
  .star{
    width:12px;height:12px;
    background: radial-gradient(circle at 30% 30%, #ffffff, #ffd56a 45%, #ffb11a 70%, #ff9a00);
    clip-path: polygon(50% 0%, 62% 36%, 100% 38%, 70% 60%, 80% 100%, 50% 78%, 20% 100%, 30% 60%, 0% 38%, 38% 36%);
    filter: drop-shadow(0 2px 2px rgba(16,24,40,.12));
  }
  .star.s2{transform:translateY(2px) scale(.9)}
  .star.s3{transform:translateY(1px) scale(.8)}

  .home{ border-color:#cfe0ff; }

  @media (max-width: 880px){
    .line{font-size:34px}
    .kbdWrap{transform:scale(.98); transform-origin:top center}
  }
  @media (max-width: 560px){
    .line{font-size:26px}
    .row{gap:6px;margin-bottom:6px}
    .key{height:44px}
  }
</style>
</head>

<body>
  <header class="topbar">
    <div class="burger" aria-label="menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </div>
    <div class="title">21. Hand gestures</div>
    <div class="spacer"></div>
    <div class="user">
      <div class="avatar" aria-hidden="true"></div>
      <div>David M</div>
      <div class="caret">▾</div>
    </div>
  </header>

  <div class="floating" aria-hidden="true">
    <div class="fab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M16 11c1.66 0 3-1.34 3-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3Z"/>
        <path d="M8 11c1.66 0 3-1.34 3-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3Z"/>
        <path d="M8 13c-2.76 0-5 1.79-5 4v2h10v-2c0-2.21-2.24-4-5-4Z"/>
        <path d="M16 13c-1.07 0-2.06.26-2.86.71"/>
        <path d="M19 19v-2c0-1.44-1.01-2.71-2.48-3.46"/>
      </svg>
    </div>
    <div class="fab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M20 14V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h8"/>
        <path d="M8 11h8M8 15h6"/>
        <path d="M19 18l2 2"/>
        <path d="M17 20a3 3 0 1 1 0-6 3 3 0 0 1 0 6Z"/>
      </svg>
    </div>
  </div>

  <main class="wrap">
    <div class="hint" id="hint">Type to begin or click start when it appears.</div>

    <section class="exercise" aria-label="exercise" id="exercise">
      <button id="startBtn" class="start hidden">START TYPING</button>
      <div class="line" id="line1"></div>
      <div class="divider"></div>
      <div class="line" id="line2"></div>
      <div class="divider"></div>
      <div class="line" id="line3"></div>
      <div class="divider"></div>
      <div class="line" id="line4"></div>
    </section>

    <section class="kbdWrap" aria-label="keyboard">
      <div id="keyboardMount"></div>
    </section>
  </main>

<script>
  const lines = [
    "ffff jj fjfj ffjj jjff fj f",
    "ffff jfjf jj ff jj jf fj jj",
    "fjff jfjj jjjf fjjj fj fj",
    "fjfj jfjf jf jf jf fj fj jf"
  ];

  const keyboardMount = document.getElementById("keyboardMount");
  const keyboardLayout = [
    [
      { key: "`", main: "`", sub: "~", size: "small" },
      { key: "1", main: "1", sub: "!", size: "small" },
      { key: "2", main: "2", sub: "@", size: "small" },
      { key: "3", main: "3", sub: "#", size: "small" },
      { key: "4", main: "4", sub: "$", size: "small" },
      { key: "5", main: "5", sub: "%", size: "small" },
      { key: "6", main: "6", sub: "^", size: "small" },
      { key: "7", main: "7", sub: "&", size: "small" },
      { key: "8", main: "8", sub: "*", size: "small" },
      { key: "9", main: "9", sub: "(", size: "small" },
      { key: "0", main: "0", sub: ")", size: "small" },
      { key: "-", main: "-", sub: "_", size: "small" },
      { key: "=", main: "=", sub: "+", size: "small" },
      { key: "Backspace", main: "⌫", size: "small w2" }
    ],
    [
      { key: "Tab", sub: "tab", size: "w1_5" },
      { key: "q", main: "Q" },
      { key: "w", main: "W" },
      { key: "e", main: "E" },
      { key: "r", main: "R" },
      { key: "t", main: "T" },
      { key: "y", main: "Y" },
      { key: "u", main: "U" },
      { key: "i", main: "I" },
      { key: "o", main: "O" },
      { key: "p", main: "P" },
      { key: "[", main: "[" },
      { key: "]", main: "]" },
      { key: "\\", main: "\\" }
    ],
    [
      { key: "CapsLock", sub: "caps lock", size: "w2" },
      { key: "a", main: "A" },
      { key: "s", main: "S" },
      { key: "d", main: "D" },
      { key: "f", main: "F", extraClass: "home" },
      { key: "g", main: "G" },
      { key: "h", main: "H" },
      { key: "j", main: "J", extraClass: "home" },
      { key: "k", main: "K" },
      { key: "l", main: "L" },
      { key: ";", main: ";" },
      { key: "'", main: "'" },
      { key: "Enter", sub: "enter", size: "w2_5" }
    ],
    [
      { key: "ShiftLeft", sub: "shift", size: "w2_5" },
      { key: "z", main: "Z" },
      { key: "x", main: "X" },
      { key: "c", main: "C" },
      { key: "v", main: "V" },
      { key: "b", main: "B" },
      { key: "n", main: "N" },
      { key: "m", main: "M" },
      { key: ",", main: "," },
      { key: ".", main: "." },
      { key: "/", main: "/" },
      { key: "ShiftRight", sub: "shift", size: "w2_5" }
    ],
    [
      { key: " ", size: "w3" },
      { key: "Space", size: "w5" },
      { key: "  ", size: "w3" }
    ]
  ];

  function createKeyElement(def){
    const key = document.createElement("div");
    key.className = ["key", def.size || "", def.extraClass || ""].filter(Boolean).join(" ");
    key.dataset.key = def.key;

    const stars = document.createElement("div");
    stars.className = "stars";
    stars.innerHTML = '<div class="star"></div><div class="star s2"></div><div class="star s3"></div>';

    if (def.sub) {
      const sub = document.createElement("span");
      sub.className = "sub";
      sub.textContent = def.sub;
      key.appendChild(sub);
    }
    if (def.main) {
      const main = document.createElement("span");
      main.className = "main";
      main.textContent = def.main;
      key.appendChild(main);
    }
    key.appendChild(stars);
    return key;
  }

  function renderKeyboard(mount){
    if (!mount) return new Map();
    mount.innerHTML = "";
    const kbd = document.createElement("div");
    kbd.className = "kbd";

    const map = new Map();
    keyboardLayout.forEach((rowDef, i) => {
      const row = document.createElement("div");
      row.className = "row";
      if (i === keyboardLayout.length - 1) row.style.marginBottom = "0";

      rowDef.forEach(def => {
        const key = createKeyElement(def);
        row.appendChild(key);

        map.set(def.key, key);
        // letters are already lowercase in your layout; keep this simple + reliable
        if (typeof def.key === "string" && def.key.length === 1) {
          map.set(def.key.toLowerCase(), key);
        }
      });
      kbd.appendChild(row);
    });

    mount.appendChild(kbd);
    return map;
  }

  // ===== Exercise render =====
  const line1 = document.getElementById("line1");
  const line2 = document.getElementById("line2");
  const line3 = document.getElementById("line3");
  const line4 = document.getElementById("line4");

  const lineEls = [line1, line2, line3, line4];

  const exerciseEl = document.getElementById("exercise");
  const startBtn = document.getElementById("startBtn");
  const hint = document.getElementById("hint");

  const charSpans = [];      // { span, ch }
  const charStates = [];     // "pending" | "correct" | "wrong" | "fixed"
  const charHadError = [];   // boolean

  function renderExercise(){
    charSpans.length = 0;
    charStates.length = 0;
    charHadError.length = 0;

    lineEls.forEach((el, i) => {
      el.innerHTML = "";
      const text = lines[i] || "";
      [...text].forEach(ch => {
        const s = document.createElement("span");
        s.className = "ch";
        s.textContent = ch === " " ? "\u00A0" : ch;
        el.appendChild(s);
        charSpans.push({ span: s, ch });
        charStates.push("pending");
        charHadError.push(false);
      });
    });
  }
  renderExercise();

  const keyEls = renderKeyboard(keyboardMount);

  // ===== Cursor helpers =====
  let idx = 0;

  function setState(i, state){
    const span = charSpans[i].span;
    span.classList.remove("correct", "wrong", "fixed");
    if (state === "correct") span.classList.add("correct");
    if (state === "wrong") span.classList.add("wrong");
    if (state === "fixed") span.classList.add("fixed");
    charStates[i] = state;
  }

  function moveCursorTo(i){
    charSpans.forEach(o => o.span.classList.remove("active"));
    if (!charSpans[i]) return;
    charSpans[i].span.classList.add("active");
    if (!startBtn.classList.contains("hidden")) positionStartButton();
  }

  function animateSpan(span, cls){
    span.classList.remove("bump", "shake");
    span.classList.remove(cls);
    void span.offsetWidth;
    span.classList.add(cls);
  }

  function nextTypeable(from){
    let i = from;
    while (i < charSpans.length && charSpans[i].ch === " ") i++;
    return i;
  }

  function prevTypeable(from){
    let i = from - 1;
    while (i >= 0 && charSpans[i].ch === " ") i--;
    return i;
  }

  idx = nextTypeable(0);
  moveCursorTo(idx);

  function pressKey(key){
    let k = key;
    if (k === " ") k = "Space";
    if (typeof k === "string" && k.length === 1) k = k.toLowerCase();

    const el = keyEls.get(k) || keyEls.get(key);
    if (!el) return;

    el.classList.remove("press");
    void el.offsetWidth;
    el.classList.add("press");

    window.setTimeout(() => el.classList.remove("press"), 420);
  }

  // ===== Start typing =====
  let started = false;
  let idleTimer = null;

  function positionStartButton(){
    const active = charSpans[idx];
    if (!active) return;
    const rect = active.span.getBoundingClientRect();
    const containerRect = exerciseEl.getBoundingClientRect();
    startBtn.style.left = `${rect.left - containerRect.left + rect.width / 2}px`;
    startBtn.style.top = `${rect.top - containerRect.top + rect.height / 2}px`;
  }

  function hideStartButton(){ startBtn.classList.add("hidden"); }
  function showStartButton(){
    if (started) return;
    positionStartButton();
    startBtn.classList.remove("hidden");
  }

  window.addEventListener("resize", () => {
    if (!startBtn.classList.contains("hidden")) positionStartButton();
  });

  function resetIdleTimer(){
    if (started) return;
    hideStartButton();
    clearTimeout(idleTimer);
    idleTimer = setTimeout(showStartButton, 5000);
  }

  function startTyping(){
    started = true;
    hint.textContent = "Typing enabled. Your keystrokes will animate the on-screen key.";
    hideStartButton();
  }

  startBtn.addEventListener("click", () => {
    if (!started) startTyping();
  });

  resetIdleTimer();

  // ✅ FIX: advance cursor after each attempt
  function advanceAfter(i){
    idx = nextTypeable(i + 1);
    if (idx < charSpans.length) moveCursorTo(idx);
  }

  window.addEventListener("keydown", (e) => {
    if (!started) startTyping();

    hideStartButton();
    resetIdleTimer();

    // Backspace
    if (e.key === "Backspace") {
      e.preventDefault();
      pressKey("Backspace");
      const prev = prevTypeable(idx);
      if (prev >= 0) {
        // clear prior state
        setState(prev, "pending");
        charHadError[prev] = false;
        idx = prev;
        moveCursorTo(idx);
      }
      return;
    }

    // key animation
    if (e.key === "Enter") pressKey("Enter");
    else if (e.key === "Tab") { e.preventDefault(); pressKey("Tab"); }
    else if (e.key === " ") { e.preventDefault(); pressKey("Space"); }
    else if (e.key.length === 1) pressKey(e.key);

    const i = nextTypeable(idx);
    if (i >= charSpans.length) return;

    // only accept single chars + space
    if (e.key.length !== 1 && e.key !== " ") return;

    const expected = charSpans[i].ch.toLowerCase();
    const got = e.key === " " ? " " : e.key.toLowerCase();
    const span = charSpans[i].span;

    if (expected === got){
      const nextState = charHadError[i] ? "fixed" : "correct";
      setState(i, nextState);
      animateSpan(span, "bump");
    } else {
      charHadError[i] = true;
      setState(i, "wrong");
      animateSpan(span, "shake");
    }

    // ✅ move to next character (skip spaces)
    advanceAfter(i);
  });
</script>
</body>
</html>
